name: Publish container image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commonground
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: commonground_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commonground -d commonground_audit"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: |
          npm ci
          python -m pip install -r requirements.txt

      - name: Verify contracts, bot, and reviewer site
        run: npm run verify

      - name: Verify PostgreSQL durability and leases
        run: npx tsx scripts/postgres-smoke.ts
        env:
          DATABASE_URL: postgresql://commonground:test-only-password@localhost:5432/commonground_audit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_RELEASE=${{ github.sha }}
          tags: |
            ghcr.io/leokings/commonground-bot:latest
            ghcr.io/leokings/commonground-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
